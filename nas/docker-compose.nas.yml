# NAS(Synology DS218+) 운영 구성
#
# 2026-09-14 부터 NAS 에서 운영 중이다.
#
#   (NAS) cd /volume1/dss/deploy
#   (NAS) sudo /usr/local/bin/docker compose -f docker-compose.nas.yml --env-file .env.nas up -d
#
# ⚠️ NAS 의 SSH 셸(sudo 포함)은 /usr/local/bin 이 PATH 에 없을 수 있다 — docker 는
#    전체 경로로 부른다. Container Manager 가 거기에 링크를 둔다 (Docker 24.0.2 ·
#    Compose v2.20.1, 2026-09-14 실측).
#
# 이미지는 개발 PC 에서 굽고 파일로 옮겨 온다(runbook/02-이미지-빌드.md).
#
#   (개발 PC) docker save dss-auth:1.1 -o dss-auth-1.1.tar
#   (NAS)     sudo /usr/local/bin/docker load -i dss-auth-1.1.tar
#
# 사내 주소 (2026-09-14 확정) — http://192.168.0.222:<포트>
#   통합 로그인 3100 · A/S 3000 · 계측기 3300. 개발 PC 와 같은 번호다.
#   NAS 주소는 DSM 네트워크 설정에서 수동(고정)으로 잡혀 있다.
# 2026-09-15 부터 https://login.dss21.co.kr · as. · meters. — DSM 프록시가 443 에서 호스트 이름으로 갈라
#   같은 127.0.0.1:13xxx 로 넘긴다. 이 파일은 바뀌지 않았다 (setup/04-https-cert.sh · 05-https-switch.sh).
#
# ── 이 파일이 지키는 원칙 ──────────────────────────────────────────────
#
# 1. DB 에 ports: 를 쓰지 않는다.
#    개발용 compose 를 복사해 오면 "127.0.0.1:54xx:5432" 가 딸려 온다.
#    그 한 줄이 "사내에서 NAS 를 통해서만" 원칙을 깨뜨린다. 여기서는 같은
#    도커 네트워크의 서비스 이름으로만 부른다 — 호스트 포트를 하나도 열지 않는다.
#
# 2. 앱 포트는 NAS 자신(127.0.0.1)에만 연다. 사내망 주소에는 열지 않는다.
#    사내망에서 들어오는 입구는 DSM 리버스 프록시 하나여야 한다. 우회로가
#    열려 있으면 TRUSTED_PROXY_HOPS=1 이 보호가 아니라 구멍이 된다
#    (dss-auth/.env.example 의 그 주석 참고).
#
#    처음에는 "프록시가 dss-edge 망으로 닿는다"고 적었는데 틀렸다 (2026-09-14 정정).
#    DSM 리버스 프록시는 컨테이너가 아니라 NAS 위에서 도는 nginx 라서 도커 망에
#    들어오지 못하고 서비스 이름도 모른다. 그래서 127.0.0.1 에만 포트를 열고
#    프록시가 localhost 로 받는다. 사내망 주소(192.168.0.222)에는 여전히 앱 포트가
#    하나도 열리지 않으므로 원칙은 그대로다.
#
#      192.168.0.222:3100 ─ DSM 프록시 ─→ 127.0.0.1:13100 ─→ app-auth   :3100
#      192.168.0.222:3000 ─ DSM 프록시 ─→ 127.0.0.1:13000 ─→ app-as     :3000
#      192.168.0.222:3300 ─ DSM 프록시 ─→ 127.0.0.1:13300 ─→ app-meters :3300
#
#    127.0.0.1 쪽을 1 을 붙인 번호로 두는 이유: 프록시가 3000 을 모든 주소에서
#    잡으므로, 같은 번호를 127.0.0.1 에 또 열면 둘이 부딪힌다.
#
#    개선요청(2026-09-18 더함)은 http 규칙을 만들지 않는다 — 옛 주소 셋은
#    되돌리기용으로 남아 있는 것이고(README ②표 10), 새 사이트에는 되돌릴
#    옛 주소가 없다. https 한 줄만 둔다:
#
#      https://improvements.dss21.co.kr ─ DSM 프록시(443) ─→ 127.0.0.1:13500
#                                                          ─→ app-improvements :3500
#
# 3. 컨테이너마다 메모리 상한을 건다.
#    A/S 의 엑셀 업로드(21MB 한도)가 파싱 중 크게 튄다. 상한이 없으면 그 한 번이
#    다른 컨테이너를 밀어낸다. 상한이 있으면 그 컨테이너만 죽고 포털은 산다.
#    NAS 커널에 memory cgroup 이 켜져 있어 실제로 먹힌다 (2026-09-14 실측).
#
# 4. 비밀값은 이 파일에 없다. .env.nas 와 env/*.env 에서 온다(둘 다 git 제외).
#
# 5. 로그 크기에 상한을 건다 — 서비스마다 10MB × 3개.
#    기본값은 무제한이다. HDD 한 장짜리 NAS 에서 로그가 /volume1 을 채우면
#    DB 가 먼저 죽는다 (runbook/05 11절 ㄷ).
#
# 자세한 근거는 runbook/01-postgres-통합.md 3·7·8절, runbook/05-배포-리허설.md.

name: dss

# 상시 서비스 여섯(개선요청을 주석으로 꺼 둔 지금은 다섯)이 같은 로그 설정을 쓴다
# — 아래에서 *logging 으로 불러 쓴다.
# (도구 서비스들은 `run --rm` 으로 잠깐 떴다 사라져 로그가 쌓이지 않는다.)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ══ 네트워크 ═══════════════════════════════════════════════════════════
networks:
  # 앱과 DB 만 있는 망. internal: true 라 바깥으로 나가지도 들어오지도 못한다.
  dss-data:
    internal: true
  # 앱이 바깥으로 나가는 망 — SMTP 메일, 그리고 SSO 토큰 교환(앱이 https://login.dss21.co.kr,
  # 곧 NAS 자신의 443 으로 포털을 부른다. 09-14 에는 192.168.0.222:3100). DB 는 여기 없다.
  dss-edge:

# ══ 볼륨 ═══════════════════════════════════════════════════════════════
volumes:
  # ⚠️ 개발 PC 의 옛 볼륨과 이름이 다르다. 되돌리기를 위해 일부러 새 이름을 쓴다.
  dss-pg-app-data:
    name: dss-pg-app-data
  dss-pg-auth-data:
    name: dss-pg-auth-data

services:
  # ══ 데이터베이스 둘 ═════════════════════════════════════════════════
  #
  # 인증용을 따로 세우는 이유: 서명 개인키·카카오 시크릿·클라이언트 시크릿
  # 해시를 다뤄 등급이 다르다. 업무 DB 가 전부 털려도 닿지 못해야
  # "포털은 누구인가만 답한다"는 원칙이 실제로 성립한다.
  #
  # TZ 를 주지 않는다 — 개발 PC 의 두 인스턴스(이 정의를 extends 로 끌어다
  # 쓴다)와 모양을 같게 둔다. 시간대가 필요한 것은 앱이고, 앱에는 준다.

  db-app:
    image: postgres:17
    container_name: dss-pg-app
    restart: unless-stopped
    logging: *logging
    networks: [dss-data]
    # ports: 없음 — 위 원칙 1. 이 줄을 되살리지 말 것.
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      # 기본값은 POSTGRES_USER 와 같은 이름의 DB 를 만든다. 그럴 이유가 없으므로
      # 이미 있는 postgres 를 쓴다. 업무 DB 는 초기화 스크립트가 만든다.
      POSTGRES_DB: postgres
      # 초기화 스크립트가 -v 로 psql 에 넘긴다.
      AS_APP_PASSWORD: ${AS_APP_PASSWORD}
      METERS_APP_PASSWORD: ${METERS_APP_PASSWORD}
      # ── 🔴 개선요청 ①/셋 — 2026-09-18 주석 처리 ─────────────────────────
      #    개선요청 첫 설치를 **다른 날로 미뤘다**(2026-09-18 결정). 그래서 이
      #    파일의 개선요청 자리 **셋**을 주석으로 덮어 두었다:
      #      ① 여기(db-app 의 IMPROVEMENTS_APP_PASSWORD 한 줄)
      #      ② app-improvements 서비스   ③ tools-improvements 서비스
      #
      #    🔴 ②③ 을 켜 두면 안 되는 이유: 그 둘이 `./env/improvements.env` 를
      #       요구하는데 **그 파일이 아직 NAS 에 없다.** 없는 env_file 하나면
      #       `docker compose` 명령이 **통째로** 안 먹는다 — 앱을 멈춘 뒤에 그걸
      #       알게 되면 다시 띄우지 못한다.
      #
      #    ① 을 함께 끄는 이유는 다르다. 이 줄은 db-app 의 **설정 지문**을 바꾼다.
      #       꺼 두면 지금 NAS 에서 도는 상태와 똑같아져서, 누가 실수로 인자 없이
      #       `up -d` 를 쳐도 **DB 컨테이너가 재생성되지 않는다.** (값 자체는 볼륨이
      #       빌 때 한 번만 도는 init/app/01-roles.sh 가 쓰는 것이라, 이미 초기화가
      #       끝난 NAS 에서는 지금 쓰이지 않는다.)
      #
      #    🔴 벗기는 때: `runbook/06-개선요청-배포.md` 의 **첫 설치를 할 때**.
      #       그 문서 2-ㅅ 가 `env/improvements.env` 를 만든다. 세 자리를 **함께**
      #       벗겨야 한다 — 하나만 벗기면 또 깨진다.
      #
      # (아래 넉 줄은 벗기면 그대로 살아나는 원래 주석이다.)
      # 2026-09-18 더함. init/app/01-roles.sh 가 이 값을 요구한다 — 없으면
      # **볼륨을 비우고 다시 세울 때** 초기화가 첫 줄에서 멈춘다.
      #
      # ⚠️ 이 줄이 늘면 db-app 의 설정 지문이 바뀐다. 지금 도는 컨테이너에는
      #    영향이 없지만(초기화는 이미 끝났다), 인자 없는 `up -d` 는 그 차이를 보고
      #    **DB 를 다시 만든다**(자료는 볼륨에 남는다). 앱을 띄울 때는
      #    `up -d --no-deps app-…` 로 부른다 — runbook/06 4절.
      IMPROVEMENTS_APP_PASSWORD: ${IMPROVEMENTS_APP_PASSWORD}
    volumes:
      - dss-pg-app-data:/var/lib/postgresql/data
      # ⚠️ 이 스크립트는 데이터 폴더가 비어 있을 때 **한 번만** 돈다.
      #    나중에 고쳐도 이미 만들어진 롤에는 반영되지 않는다.
      - ./init/app:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB   # 플래너에게 알려 줄 뿐 메모리를 잡지 않는다
      - -c
      - work_mem=4MB                 # 커넥션마다 잡힌다. 40 × 4MB 가 상한
      - -c
      - maintenance_work_mem=64MB    # 복원과 VACUUM 이 빨라진다
      - -c
      - max_connections=40           # 기본 100 은 6GB 에서 과하다
      - -c
      - random_page_cost=4.0         # HDD 기준. SSD 로 바꾸면 1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  db-auth:
    image: postgres:17
    container_name: dss-pg-auth
    restart: unless-stopped
    logging: *logging
    networks: [dss-data]
    # ports: 없음
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_APP_PASSWORD: ${AUTH_APP_PASSWORD}
    volumes:
      - dss-pg-auth-data:/var/lib/postgresql/data
      - ./init/auth:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
      - -c
      - random_page_cost=4.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  # ══ 앱 셋 ═══════════════════════════════════════════════════════════
  #
  # env_file 에는 각 앱의 나머지 설정이 들어간다(카카오 키, SMTP, SSO 주소 등).
  # 만드는 법은 env/README.md 에 있다. DATABASE_URL 만 여기서 조립하는 이유는
  # 비밀번호가 .env.nas 한 곳에만 있게 하기 위해서다 — 같은 값을 두 파일에
  # 적어 두면 언젠가 한쪽만 바뀐다.
  #
  # 컨테이너 안의 경로(/data · /keys · /templates)도 여기서 정한다. 볼륨과 짝이라
  # 한 파일에 있어야 어긋나지 않는다.
  #
  # TZ: Asia/Seoul — 개발 PC 의 앱은 Windows 의 한국 시각으로 돈다. 컨테이너는
  # 기본이 UTC 라 주지 않으면 날짜 경계(인수번호 D+YYMM, 교정 기한)가 9시간
  # 어긋난다. 세 이미지 모두 tzdata 가 들어 있어 실제로 먹힌다 (2026-09-14 실측).

  app-auth:
    image: dss-auth:1.5
    container_name: dss-auth
    restart: unless-stopped
    logging: *logging
    networks: [dss-data, dss-edge]
    # NAS 자신에게만 연다 — 위 원칙 2. "3100:3100" 으로 바꾸지 말 것.
    ports: ["127.0.0.1:13100:3100"]
    env_file:
      - ./env/auth.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://dss_auth_app:${AUTH_APP_PASSWORD}@dss-pg-auth:5432/dss_auth
      # 백업이 컨테이너 안에서 돌 때는 direct 뿐이다. 컨테이너에는 docker 명령이 없다.
      BACKUP_MODE: direct
      AUTH_KEYS_DIR: /keys
    volumes:
      # ⚠️ 서명 개인키. 이미지에 넣지 않고 여기서 붙인다 —
      #    이미지는 파일로 복사되어 돌아다니므로 한 번 들어가면 회수할 수 없다.
      #    읽기 전용으로 붙인다. 앱은 서명만 하고 키를 고치지 않는다.
      - /volume1/dss/auth-keys:/keys:ro
    depends_on:
      db-auth:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  app-as:
    image: dss-as:2.3
    container_name: dss-as
    restart: unless-stopped
    logging: *logging
    networks: [dss-data, dss-edge]
    ports: ["127.0.0.1:13000:3000"]
    # ⚠️ 견적서 공유폴더 하나 때문에 붙인다 (2026-09-16 실측).
    #    그 폴더는 /volume1/dss 와 달리 **Synology ACL 이 사람 이름으로 허용**하는
    #    곳이다. ls 에 777 로 보여도 판정은 ACL 이 하고, 컨테이너의 node(uid 1000)는
    #    DSM 사용자가 아니라 그 목록에 없다 — 그대로 두면 Permission denied 다.
    #
    #    목록에 group:users:allow 가 있어 **gid 100(users)만 곁들인다.** uid 와 주
    #    그룹은 1000 그대로라 /data · /templates 의 주인은 바뀌지 않는다. ACL 을
    #    걷는 길(01-prepare.sh 가 /volume1/dss 에 하는 것)은 여기에 쓰지 않는다 —
    #    거기서 걷으면 **직원의 탐색기 접근이 끊긴다.**
    #
    #    이 그룹이 닿는 곳은 이 컨테이너에 붙인 볼륨뿐이다.
    group_add: ["100"]
    env_file:
      - ./env/as.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://dss_app:${AS_APP_PASSWORD}@dss-pg-app:5432/dss_as
      UPLOADS_DIR: /data
      # 양식 일곱 — 아래 /templates 볼륨 안의 파일 이름과 글자 하나까지 같아야 한다.
      # 하나라도 못 읽으면 그 출력(견적서·검사/수리 보고서)이 통째로 죽는다.
      # 이 줄들이 빠져 있던 것이 runbook/05 11절의 구멍 ㄱ 이다 (2026-09-14 메움).
      #
      # 🔴 setup/01-prepare.sh 는 아직 「xlsx 가 정확히 6개」를 검사한다. 케이블이
      #    들어와 일곱이 되었으므로 그 스크립트를 다시 돌릴 일이 생기면 기대값을
      #    7 로 고쳐야 한다 (첫 설치용이라 배포에는 쓰지 않는다).
      QUOTE_TEMPLATE_PATH: "/templates/내자견적서.xlsx"
      OH_QUOTE_TEMPLATE_PATH: "/templates/제너레이터 OH 견적서.xlsx"
      MATCHER_QUOTE_TEMPLATE_PATH: "/templates/매쳐 내자 견적서.xlsx"
      MATCHER_OH_QUOTE_TEMPLATE_PATH: "/templates/매쳐 OH 견적서.xlsx"
      # 케이블 견적서 (2026-09-18 더함). 파일은 이미 NAS 에 올라가 있다 —
      # -r-------- 1000:1000, sha256 7bfc64e9…(개발 PC 원본과 대조 확인).
      CABLE_QUOTE_TEMPLATE_PATH: "/templates/케이블 견적서.xlsx"
      INSPECTION_REPORT_TEMPLATE_PATH: "/templates/검사보고서.xlsx"
      REPAIR_REPORT_TEMPLATE_PATH: "/templates/수리보고서.xlsx"
    volumes:
      # 첨부파일(사진·도면·성적서). 이미지에 없고 여기서 붙인다.
      # 결정 D — A/S 는 업무 자료를 옮기지 않으므로 NAS 에서는 빈 폴더로 시작한다.
      - /volume1/dss/as-attachments:/data
      # 양식 — 법인 직인·계좌번호가 들어 있어 저장소에 없다. 앱은 읽기만 한다.
      - /volume1/dss/as-templates:/templates:ro
      # ⚠️ 견적서 공유폴더 (2026-09-16). **직원이 20년째 탐색기로 쓰는 실제 서류함**이다.
      #    여기만 다른 볼륨과 성격이 다르다 — /volume1/dss 아래가 아니라 사람의 공유폴더다.
      #
      #    앱은 <루트>/<연도 폴더>/<견적서 폴더>/<파일> 로 **사본을 꽂아 준다.** 연도 폴더
      #    이름이 `21. 2026 내자견적서` 꼴이라(연도−2005) 이 폴더가 루트여야 맞는다.
      #    루트는 앱이 만들지 않는다 — 볼륨이 빠지면 조용히 컨테이너 안 임시 디스크에
      #    쓰는 대신 실패로 끝난다(quote-archive.ts 의 그 주석).
      #
      #    ⚠️ ACL 을 걷지 않는다. /volume1/dss 는 01-prepare.sh 가 ACL 을 걷고 uid 1000 에게
      #       주지만, 여기서 같은 짓을 하면 **직원의 탐색기 접근이 끊긴다.** 컨테이너(uid 1000)가
      #       쓸 수 있는지는 07-deploy.sh 2단계가 실제로 시험하고, 안 되면 거기서 멈춘다.
      #
      #    앱은 덮어쓰지 않는다 — 파일은 open(…,"wx") 로만 열고 이미 있으면 ` (2)` 로 넘어간다.
      #
      #    경로에 공백과 괄호가 있어 **긴 문법**으로 적는다. 짧은 문법("원본:대상")은
      #    한 줄을 콜론으로 가르는데, 그 줄에 따옴표를 씌우면 이번엔 전체가 원본 하나로 읽힌다.
      - type: bind
        source: "/volume1/3_견적-세금계산서-국내발주/4. DSS 내자견적서 (활용)"
        target: /quote-archive
      # ⚠️ 고객사 현황표 공유폴더 (2026-10-02 더함 · 열두째 배포).
      #    「고객 안내 현황」의 고객사 양식 표를 엑셀로 내보내 꽂아 주는 자리다.
      #    🔴 **견적서 공유폴더와 다른 곳이다.** 설정도 따로다
      #       (CUSTOMER_PORTAL_ARCHIVE_* — NAS 의 env/as.env 에 적는다).
      #
      #    여기도 **직원이 탐색기로 쓰는 실제 서류함**이다. 그래서 견적서 볼륨과
      #    같은 규칙이 그대로 산다:
      #      · ACL 을 걷지 않는다. chmod 로 걷으면 직원의 탐색기 접근이 끊긴다.
      #        컨테이너(uid 1000)가 쓸 수 있는 근거는 위 group_add: ["100"] 이다.
      #      · 루트는 앱이 만들지 않는다 — 이 볼륨이 빠지면 저장이 **실패로 끝난다**
      #        (없는 루트를 만들면 컨테이너 안 임시 디스크에 쓰게 되기 때문이다).
      #
      #    🔴 견적서와 **다른 것 둘**:
      #      · 연도 폴더 · 건별 폴더가 없다. **폴더 하나뿐**이고 앱은 그 **맨 위
      #        칸의 파일만** 본다 — 옛 판을 모아 둔 `OLD` 하위 폴더로는 내려가지
      #        않는다(storage/customer-portal-archive.ts).
      #      · 🔴 같은 이름이면 **덮어쓴다**(2026-09-30 사용자 결정). 견적서는
      #        지금도 ` (2)` 로 비켜 간다 — 이쪽만 다르다. 덮어쓰기는 같은 폴더의
      #        임시 이름(`~$…tmp`)에 다 쓴 뒤 rename 으로 바꿔치기하므로, 쓰다가
      #        끊겨도 있던 파일은 한 글자도 바뀌지 않는다.
      #      · 저장한 **뒤에** 날짜가 지난 그 고객사의 옛 파일을 `OLD` 로 옮긴다.
      #        `OLD` 가 없으면 앱이 만든다 — 그래서 이 루트에는 **폴더를 만들 수
      #        있는 권한**까지 있어야 한다(16-deploy.sh 가 --go 에서 시험한다).
      #
      #    🔴 `2_AS센터` 의 AS 는 **대문자**다. Windows 탐색기에서 본 이름
      #       (`2_as센터`)을 그대로 적으면 리눅스에서 조용히 빈 폴더가 된다.
      #    경로에 공백과 점이 있어 **긴 문법**으로 적는다 — 까닭은 위 견적서 볼륨.
      - type: bind
        source: "/volume1/2_AS센터/1. 수리 관련/7. 수리품 목록/3. 업체별 수리품현황"
        target: /customer-portal-archive
      # ⚠️ 연락서 공유폴더 (2026-10-05 더함 · 열넷째 배포).
      #    수리 건 하나에 폴더 하나가 있는 **직원의 서류함**이다. 이름이 곧 목록이다:
      #      D260908 INVENIA T2RCONT-AD2 WN3947 1802034 점검요청/
      #    = 인수번호 고객사 모델명 L/N S/N 신고증상
      #    앱은 **인수번호 하나로만** 그 폴더를 찾는다(나머지 다섯은 사후 수정되므로
      #    짝짓기에 쓰면 지난번 수리 건에 이번 자료를 넣게 된다 —
      #    RF_Service_System/src/lib/domain/contact-folder-naming.ts 머리말).
      #
      #    🔴 **견적서 · 현황표와 또 다른 곳이다.** 설정도 따로다
      #       (CONTACT_FOLDER_ARCHIVE_* — NAS 의 env/as.env 에 적는다. 셋이다).
      #
      #    🔴 **쓰기 가능으로 붙인다**(read_only 를 쓰지 않는다). 앱이 여기에
      #       **폴더를 만들고 파일을 꽂는다**:
      #         · 수리 건 상세 [연락서 폴더 만들기] · **접수하면 자동 생성**
      #         · 올린 첨부의 사본을 분류 폴더에 꽂기
      #         · 폴더 안의 `DATA` 폴더와 그 아래 분류 폴더 만들기
      #       🔵 2026-10-05 에 NAS 에서 **실측했다** — 앱 이미지(dss-as:2.0) 에
      #          `--group-add 100` 을 주고 이 경로를 붙여 파일·폴더를 만들었다 지웠다.
      #          결과 WRITE-OK · MKDIR-OK. 그래서 짐작이 아니라 잰 값으로 쓰기를 연다.
      #
      #    ⚠️ ACL 을 **걷지 않는다.** 위 견적서 · 현황표 볼륨에 적은 그대로다 —
      #       chmod 로 걷으면 **직원의 탐색기 접근이 끊긴다.** 컨테이너(uid 1000)가
      #       쓸 수 있는 근거는 이 서비스의 group_add: ["100"] 하나다.
      #       18-deploy.sh 가 --go 에서 쓰기 · 폴더 만들기 · ACL 물려받기를 실제로
      #       시험하고, 안 되면 앱을 멈추기 전에 거기서 멈춘다.
      #
      #    🔴 **tools-as 에는 붙이지 않는다.** 교산 이식용 도구 이미지이고 이 폴더를
      #       쓰는 스크립트가 없다 — 그쪽의 read_only: true 는 그대로 둔다.
      #    🔴 **app-po 에도 붙이지 않는다.** PO 저장소에 연락서 화면이 없다.
      #
      #    🔴 `2_AS센터` 의 AS 는 **대문자**다. Windows 탐색기에서 본 이름
      #       (`2_as센터`)을 그대로 적으면 리눅스에서 조용히 **빈 폴더**가 된다.
      #       그러면 앱은 「폴더가 없다」가 아니라 「폴더는 있는데 0개」를 보고
      #       **전부 짝 없음으로 판정해 새 폴더를 수백 개 만든다.**
      #    경로에 공백과 괄호가 있어 **긴 문법**으로 적는다 — 까닭은 위 견적서 볼륨.
      - type: bind
        source: "/volume1/2_AS센터/1. 수리 관련/3. 연락서(활용)/2. 연락서"
        target: /contact-folder-archive
      # ⚠️ 「수리 관련」 서류 공유폴더 (2026-10-08 더함 · 열다섯째 배포).
      #    제품 종류마다 **같은 서류를 돌려 쓰는** 사내 서류함이다 — 인수시
      #    체크시트 · 작업 수순과 자료 · 통전 체크시트처럼 모델 한 대가 아니라
      #    제품 종류 전체가 쓰는 서류가 모여 있다.
      #    제품 모델 · 종류 화면이 이 서류를 **올리지 않고 자리만 가리킨다**
      #    (사용자 결정 2026-10-07) — 올리면 같은 파일이 모델 수만큼 복사되고,
      #    사내에서 원본을 고쳐도 앱 안의 사본은 그대로 남기 때문이다.
      #
      #    🔴 **견적서 · 현황표 · 연락서와 또 다른 곳이다.** 설정도 따로다
      #       (REPAIR_DOCS_ARCHIVE_* — NAS 의 env/as.env 에 적는다. 둘이다).
      #
      #    🔴 **읽기 전용이다**(read_only: true · 사용자 결정 2026-10-08).
      #       위 세 볼륨과 **반대**다. 까닭:
      #         · 앱은 이 폴더를 **훑어 경로를 DB 에 적을 뿐** 쓰지 않는다.
      #           만들기 · 쓰기 · 지우기가 코드에 **한 글자도 없다**
      #           (RF_Service_System/src/lib/storage/repair-docs-archive.ts ·
      #            repair-docs-entries.ts 의 머리말. 원본을 글자로 읽는 시험이
      #            그 사실을 못 박는다 — repair-docs-entries-source.test.ts).
      #         · 파일을 **여는** 일은 사람 PC 의 탐색기 도우미가 한다.
      #       🔴 그래서 **쓰기가 되면 오히려 이상한 것**이다. 19-deploy.sh 는
      #          --check · --go 양쪽에서 「읽히는가」와 **「쓰기가 막혀 있는가」**
      #          둘을 보고, 쓰기가 되면 거기서 멈춘다.
      #
      #    🔴 **이 볼륨은 바로 위 연락서 볼륨의 윗 폴더다.** 같은 나무를 두 번
      #       붙이는 셈인데, 도커의 바인드는 서로 독립이라 **이쪽이 읽기 전용이어도
      #       연락서 쪽 쓰기는 그대로 산다.** 접수 때 연락서 폴더가 저절로 생기는
      #       길이 죽지 않는다 — 19-deploy.sh 7-ㄴ 이 교체 뒤에 실제로 확인한다.
      #
      #    ⚠️ ACL 을 **걷지 않는다.** 위 세 볼륨에 적은 그대로다 — chmod 로 걷으면
      #       **직원의 탐색기 접근이 끊긴다.** 컨테이너(uid 1000)가 읽을 수 있는
      #       근거는 이 서비스의 group_add: ["100"] 하나다.
      #
      #    🔴 **tools-as 에는 붙이지 않는다.** 교산 이식용 도구 이미지이고 이
      #       폴더를 쓰는 스크립트가 없다.
      #    🔴 **app-po 에도 붙이지 않는다.** PO 저장소에 이 화면이 없다.
      #
      #    🔴 `2_AS센터` 의 AS 는 **대문자**다. Windows 탐색기에서 본 이름
      #       (`2_as센터`)을 그대로 적으면 리눅스에서 조용히 **빈 폴더**가 되고,
      #       고르는 창이 「서류가 하나도 없다」로 보인다.
      #    경로에 공백이 있어 **긴 문법**으로 적는다 — 까닭은 위 견적서 볼륨.
      - type: bind
        source: "/volume1/2_AS센터/1. 수리 관련"
        target: /repair-docs-archive
        read_only: true
    depends_on:
      db-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 셋 중 가장 넉넉하게 준다. 21MB 엑셀을 파싱할 때 크게 튄다.
          memory: 640M

  app-meters:
    image: dss-meters:1.3
    container_name: dss-meters
    restart: unless-stopped
    logging: *logging
    networks: [dss-data, dss-edge]
    ports: ["127.0.0.1:13300:3300"]
    env_file:
      - ./env/meters.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://dss_meters_app:${METERS_APP_PASSWORD}@dss-pg-app:5432/dss_meters
      FILE_STORAGE_ROOT: /data
    volumes:
      # 계측기 사진과 교정 성적서.
      # ⚠️ 쓰기 권한을 node(uid 1000)에게 줘야 한다. 안 그러면 사진 업로드가
      #    조용히 실패한다. dss 공유 폴더는 시놀로지 ACL 이 administrators 만
      #    허용하므로, NAS 준비 스크립트가 이 폴더의 ACL 을 걷고 1000 에게 준다.
      - /volume1/dss/meters-files:/data
    depends_on:
      db-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ══ 개선요청 (2026-09-18 더함) ══════════════════════════════════════
  #
  # 넷째 사이트다. 위 셋과 같은 틀을 그대로 쓴다 — 다른 것은 업로드 볼륨의
  # 컨테이너 쪽 경로 하나뿐이고 그 이유는 아래에 적었다.
  #
  # 주소는 https 뿐이다 — https://improvements.dss21.co.kr (DSM 프록시 443 →
  # 127.0.0.1:13500). 인증서는 이미 있는 와일드카드(*.dss21.co.kr)가 덮는다.
  # ⚠️ Cloudflare 에 A 레코드 `improvements` 가 하나 늘어야 한다 (사람이 한다).
  #
  # ── 🔴 개선요청 ②/셋 — 2026-09-18 주석 처리 ═════════════════════════
  #    개선요청 첫 설치를 **다른 날로 미뤘다**(2026-09-18 결정).
  #    🔴 이 서비스는 `./env/improvements.env` 를 요구하는데 **그 파일이 아직
  #       NAS 에 없다.** 켜 두면 없는 env_file 하나 때문에 `docker compose`
  #       명령이 **통째로** 안 먹는다 — 앱을 멈춘 뒤에 그걸 알게 되면 다시
  #       띄우지 못한다.
  #
  #    🔴 벗기는 때: `runbook/06-개선요청-배포.md` 의 **첫 설치를 할 때**.
  #       그 문서 2-ㅅ 가 `env/improvements.env` 를 만든다.
  #       세 자리(① db-app 의 IMPROVEMENTS_APP_PASSWORD · ② 여기 ·
  #       ③ tools-improvements)를 **함께** 벗겨야 한다 — 하나만 벗기면 또 깨진다.
  #       벗기는 법: 아래 줄들의 맨 앞 두 칸 뒤에 붙은 `# ` 만 지운다.
  #
  app-improvements:
    image: dss-improvements:0.3
    container_name: dss-improvements
    restart: unless-stopped
    logging: *logging
    networks: [dss-data, dss-edge]
    # dss-edge 가 필요한 이유: 로그인 토큰 교환이 https://login.dss21.co.kr 로
    # 나갔다 들어온다(NAS 자신의 443 이지만 컨테이너에서는 바깥이다).
    #
    # 3500 → 13500. 위 원칙 2 와 같은 규칙(앞에 1 을 붙인 번호).
    ports: ["127.0.0.1:13500:3500"]
    env_file:
      - ./env/improvements.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://dss_improvements_app:${IMPROVEMENTS_APP_PASSWORD}@dss-pg-app:5432/dss_improvements
      # 🔴 스크린샷의 **바이트가 놓이는 곳**이다. DB 에는 이 루트 기준 상대
      #    경로만 적힌다(그 저장소 src/lib/db/schema.ts 의 stored_path 주석).
      #    아래 볼륨과 짝이라 한쪽만 바꾸면 올린 파일을 찾지 못한다.
      #    값이 없으면 앱이 던진다 — 조용한 기본값이 없다(그 저장소가 일부러
      #    그렇게 두었다).
      UPLOADS_DIR: /data/uploads
      # PORT 는 적지 않는다 — 이미지가 ENV PORT=3500 으로 들고 있다.
      # 여기서 또 적으면 같은 값이 두 곳에 생기고 언젠가 한쪽만 바뀐다.
    volumes:
      # 🔴 이 한 줄이 이 서비스에서 가장 중요하다. 빠지면 올린 스크린샷이
      #    컨테이너 안 임시 디스크에 쌓이고, **다음 배포에서 컨테이너를 새로
      #    만드는 순간 전부 사라진다.** 앱은 DB 에 적힌 상대 경로로 파일을
      #    찾으므로 화면에는 첨부가 있는데 바이트만 없는 상태가 된다.
      #
      #    NAS 쪽 경로는 계측기(meters-files)·A/S(as-attachments)에서 그대로
      #    가져왔다 — /volume1/dss/<시스템>-<용도>. 그 폴더들은 01-prepare.sh 가
      #    Synology ACL 을 걷고 node(uid 1000)에게 준 자리라 권한 처리도 같다.
      #    (A/S 의 /quote-archive 같은 「직원이 쓰는 공유폴더」가 아니다.)
      #
      #    컨테이너 쪽만 /data 가 아니라 /data/uploads 다. 그 저장소의
      #    .env.example 이 운영 값으로 그렇게 적어 두었고, 나중에 볼륨이
      #    하나 더 붙어도 /data 아래로 나란히 들어간다.
      - /volume1/dss/improvements-uploads:/data/uploads
    depends_on:
      db-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 앱 넷 중 가장 작게 준다 — 첨부는 20MB 를 스트림으로 디스크에 흘려
          # 쓰고(한 글에 5장), A/S 의 엑셀 파싱 같은 봉우리가 없다. 포털과 같다.
          memory: 384M

  # ══ PO / 내자 (3600) ═════════════════════════════════════════════════
  #
  # 🔴 **아직 주석 처리돼 있다**(2026-09-28, 첫 설치 전). `env/po.env` 가 NAS 에
  #    없는데 켜 두면 `docker compose` 명령이 **통째로** 안 먹는다 — 앱을 멈춘
  #    뒤에 그걸 알게 되면 다시 띄우지 못한다.
  #
  #    🔴 벗기는 때: `runbook/08-PO-배포.md` 의 **첫 설치를 할 때**. 그 문서
  #       3-ㅁ 가 `env/po.env` 를 만들고, 3-ㅂ 이 여기를 벗긴다.
  #       🔴 개선요청과 달리 **벗길 자리가 여기 하나뿐이다** — db-app 에 더할
  #       비밀번호도 없고(A/S 의 AS_APP_PASSWORD 를 그대로 쓴다), 도구 서비스도
  #       없다. 벗기는 법: 아래 줄들의 맨 앞 두 칸 뒤에 붙은 `# ` 만 지운다.
  #
  # ── 🔴 이 서비스는 앞의 넷과 근본이 다르다 ──────────────────────────
  # DB 를 새로 만들지 않는다. A/S 와 **같은 dss_as** 를 **같은 롤 dss_app** 으로
  # 보고, 첨부 폴더 · 양식 · 견적서 공유폴더도 **A/S 와 같은 것**을 붙인다.
  # 견적서·발주·내자를 A/S 에서 떼어 낸 사이트이고, 같은 표를 본다
  # (설계서 PO_DOMESTIC_SPLIT_DESIGN.md B-2 · D절).
  #
  # 🔴 **첨부 폴더를 새로 만들지 마라.** 두 사이트가 같은 `attachments` 표를
  #    보는데 표에는 파일의 상대 경로만 있다. 폴더를 나누면 A/S 에서 붙인
  #    파일을 PO 가 못 찾는다(반대도 같다).
  #
  # 🔴 **도구 서비스(tools-po)를 만들지 않는다.** 이 저장소에는 마이그레이션도
  #    야간 작업도 없다. 야간 완전삭제는 아래 tools-as 가 계속 맡고, 같은 표라
  #    그것이 PO 의 휴지통도 함께 비운다. A/S 에서 그것을 걷어내면 PO 휴지통이
  #    영영 안 비워진다 — 화면은 계속 「15일 뒤 자동 삭제」라고 말하면서.
  #
  app-po:
    image: dss-po:0.3
    container_name: dss-po
    restart: unless-stopped
    logging: *logging
    networks: [dss-data, dss-edge]
    # 3600 → 13600. 위 원칙 2 와 같은 규칙(앞에 1 을 붙인 번호).
    ports: ["127.0.0.1:13600:3600"]
    # ⚠️ 견적서 공유폴더의 Synology ACL 때문이다 — 까닭은 app-as 의 같은 줄
    #    주석에 길게 적혀 있다(2026-09-16 실측). 빠뜨리면 발행이 Permission
    #    denied 로 끝난다. ACL 을 걷지는 마라 — 직원의 탐색기 접근이 끊긴다.
    group_add: ["100"]
    env_file:
      - ./env/po.env
    environment:
      TZ: Asia/Seoul
      # 🔴 A/S 와 같은 DB · 같은 롤 · 같은 비밀번호다. 새 값을 만들지 않는다.
      DATABASE_URL: postgresql://dss_app:${AS_APP_PASSWORD}@dss-pg-app:5432/dss_as
      # 🔴 A/S 와 **같은 폴더**다(위 머리말).
      UPLOADS_DIR: /data
      # 양식 다섯 — A/S 는 일곱을 쓰지만 이 사이트는 견적서 다섯만 쓴다
      # (검사·수리 보고서는 A/S 의 것이다). 아래 /templates 볼륨 안의 파일
      # 이름과 글자 하나까지 같아야 한다 — 하나라도 못 읽으면 그 종류의
      # 견적서 출력이 통째로 죽는다.
      QUOTE_TEMPLATE_PATH: "/templates/내자견적서.xlsx"
      OH_QUOTE_TEMPLATE_PATH: "/templates/제너레이터 OH 견적서.xlsx"
      MATCHER_QUOTE_TEMPLATE_PATH: "/templates/매쳐 내자 견적서.xlsx"
      MATCHER_OH_QUOTE_TEMPLATE_PATH: "/templates/매쳐 OH 견적서.xlsx"
      CABLE_QUOTE_TEMPLATE_PATH: "/templates/케이블 견적서.xlsx"
    volumes:
      # 🔴 A/S 와 같은 폴더. 나누면 서로의 첨부를 못 찾는다.
      - /volume1/dss/as-attachments:/data
      - /volume1/dss/as-templates:/templates:ro
      # 견적서 공유폴더 — 경로에 공백과 괄호가 있어 긴 문법으로 적는다.
      # 까닭은 app-as 의 같은 자리 주석.
      - type: bind
        source: "/volume1/3_견적-세금계산서-국내발주/4. DSS 내자견적서 (활용)"
        target: /quote-archive
    depends_on:
      db-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # A/S 와 같게 준다 — 엑셀 워크북을 파싱할 때 크게 튄다.
          memory: 640M

  # ══ 휴가 관리 (3700) ═════════════════════════════════════════════════
  #
  # 여섯째 사이트다 (2026-09-29 더함). 틀은 개선요청(app-improvements)과 같다 —
  # 자기 DB(dss_leave) · 자기 롤(dss_leave_app) · 전 직원 공개(포털 등록의
  # requires_grant 가 false 라 PO 처럼 명단을 넣을 일이 없다).
  #
  # 🔴 개선요청과 **다른 것 하나: 업로드 볼륨이 없다.** 이 앱은 파일을 올리지
  #    않는다 — 저장소에 UPLOADS_DIR 류의 환경변수도, 그것을 읽는 코드도 없다
  #    (2026-09-29 확인). 없는 것이 맞으므로 나중에 「빠뜨린 것 같다」며 더하지
  #    마라. 더하면 쓰이지 않는 폴더가 하나 늘고 야간 백업의 rsync 목록도
  #    따라 늘어난다.
  #
  # 주소는 https 뿐이다 — https://leave.dss21.co.kr (DSM 프록시 443 →
  # 127.0.0.1:13700). 인증서는 이미 있는 와일드카드(*.dss21.co.kr)가 덮는다.
  # ⚠️ Cloudflare 에 A 레코드 `leave` 가 하나 늘어야 한다 (사람이 한다).
  #
  # 🔴 db-app 에 LEAVE_APP_PASSWORD 를 더하지 **않는다.** 그런 줄(개선요청의
  #    IMPROVEMENTS_APP_PASSWORD)은 볼륨이 빌 때 한 번만 도는
  #    init/app/01-roles.sh 를 위한 것인데, 휴가의 롤과 DB 는
  #    setup/13-leave-db.sh 로 **이미 손으로 만들었다.** 더해 봐야 db-app 의
  #    설정 지문만 바뀌어, 인자 없는 `up -d` 가 DB 컨테이너를 다시 만든다.
  #
  app-leave:
    image: dss-leave:0.1
    container_name: dss-leave
    restart: unless-stopped
    logging: *logging
    # dss-edge 가 필요한 이유: 로그인 토큰 교환이 https://login.dss21.co.kr 로
    # 나갔다 들어온다(NAS 자신의 443 이지만 컨테이너에서는 바깥이다).
    networks: [dss-data, dss-edge]
    # 3700 → 13700. 위 원칙 2 와 같은 규칙(앞에 1 을 붙인 번호).
    ports: ["127.0.0.1:13700:3700"]
    env_file:
      - ./env/leave.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://dss_leave_app:${LEAVE_APP_PASSWORD}@dss-pg-app:5432/dss_leave
      # PORT 는 적지 않는다 — 이미지가 ENV PORT=3700 으로 들고 있다
      # (그 저장소 Dockerfile 의 runner 스테이지). 여기서 또 적으면 같은 값이
      # 두 곳에 생기고 언젠가 한쪽만 바뀐다.
    depends_on:
      db-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 개선요청과 같은 384M 을 준다. 근거: 첨부 업로드도, A/S · PO 의
          # 엑셀 워크북 파싱 같은 메모리 봉우리도 없다 — 휴가 신청과 결재를
          # DB 로만 다루는 Next.js standalone 이라 첨부를 스트림으로 흘려 쓰는
          # 개선요청보다 오히려 가볍다. 포털(app-auth)과도 같은 값이다.
          memory: 384M

  # ══ 도구 — A/S ═══════════════════════════════════════════════════════
  #
  # 마이그레이션(db:migrate · db:preflight)과 매일 밤 purge 셋이 여기서 돈다.
  # 운영 이미지에는 tsx·drizzle-kit 이 없다 — runbook/05 6절 길 ㄴ.
  #
  #   docker compose -f docker-compose.nas.yml --env-file .env.nas --profile tools \
  #     run --rm tools-as npm run db:preflight
  #
  # ⚠️ drizzle/ 은 이미지에 없다. 배포마다 바뀌는 것이 사실상 그것뿐이라(28MB)
  #    볼륨으로 붙인다 — 이미지를 배포마다 옮기지 않기 위해서다(6절 ①).
  #    **이미지 태그는 굵게 간다** — 의존성이 바뀔 때만 올린다.
  tools-as:
    image: dss-as-tools:1
    profiles: [tools]
    networks: [dss-data, dss-edge]
    # ⚠️ 연락서 원본 공유폴더의 Synology ACL 때문이다 — 까닭은 app-as 의 같은 줄 주석.
    #    읽기 전용이라 이 컨테이너가 그 폴더를 건드릴 일은 없다.
    group_add: ["100"]
    env_file:
      - ./env/as.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://dss_app:${AS_APP_PASSWORD}@dss-pg-app:5432/dss_as
      UPLOADS_DIR: /data
    volumes:
      # 배포마다 여기만 갈린다. 읽기 전용 — 마이그레이션은 읽기만 한다.
      - /volume1/dss/as-migrations:/app/drizzle:ro
      # purge·backup:attachments 가 첨부를 본다. 앱과 같은 자리여야 한다.
      - /volume1/dss/as-attachments:/data
      # ── 연락서 이식 (runbook/09) ────────────────────────────────────
      # 원본 360장. 🔴 읽기 전용 — 직원이 쓰는 실제 서류함이다.
      - type: bind
        source: "/volume1/2_AS센터/1. 수리 관련/3. 연락서(활용)/2. 연락서"
        target: /kyosan-src
        read_only: true
      # 개발 PC 에서 .xls 를 바꾼 143장. 엑셀이 NAS 에 없어 여기로 올린다.
      - /volume1/dss/kyosan-converted:/kyosan-converted:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # ══ 도구 — 계측기. 평소에는 뜨지 않는다 ══════════════════════════════
  #
  # 운영 이미지에는 tsx 가 없다(devDependency). 그래서 저장소의 스크립트를
  # 컨테이너 안에서 부를 수 없다. 이것이 그 자리를 맡는다 — runbook/05 6절 길 ㄴ.
  #
  # ⚠️ profiles 가 붙은 서비스는 `up -d` 로 **뜨지 않는다.** 여섯 번째 상시
  #    서비스가 아니므로 위의 메모리 예산 2.7GB 를 건드리지 않는다. 불릴 때만
  #    잠깐 떴다 사라진다:
  #
  #   docker compose -f docker-compose.nas.yml --env-file .env.nas \
  #     run --rm tools-meters npm run send-notify
  #
  # 앱과 같은 설정 파일·같은 DB·같은 파일 볼륨을 본다. 접속 문자열을 밤에 손으로
  # 다시 타이핑하지 않기 위해서다.
  tools-meters:
    image: dss-meters-tools:1
    profiles: [tools]
    # dss-edge 가 없으면 DB 는 읽히는데 메일만 안 나간다 — dss-data 는
    # internal: true 라 바깥으로 못 나간다. 알림 메일은 cafe24 SMTP 로 나간다.
    networks: [dss-data, dss-edge]
    env_file:
      - ./env/meters.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://dss_meters_app:${METERS_APP_PASSWORD}@dss-pg-app:5432/dss_meters
      FILE_STORAGE_ROOT: /data
    volumes:
      - /volume1/dss/meters-files:/data
    # 실행 기록은 컨테이너 안(/app/logs)이 아니라 이것을 부르는
    # jobs/notify-daily.sh 가 root 로 setup/logs/ 에 남긴다 — 야간 백업과 같은
    # 방식이다. 스크립트가 찍는 줄과 로그 파일에 남기는 줄이 같아서, 볼륨을
    # 하나 더 붙이고 uid 1000 쓰기 권한을 맞추는 일이 없어진다.
    deploy:
      resources:
        limits:
          memory: 512M

  # ══ 도구 — 개선요청. 평소에는 뜨지 않는다 ════════════════════════════
  #
  # 운영 이미지에 drizzle-kit 이 없다(devDependency). 그래서 그 안에서는
  # db:migrate 를 부를 수 없다 — runbook/05 6절 길 ㄴ. 이것이 그 자리를 맡는다.
  #
  #   docker compose -f docker-compose.nas.yml --env-file .env.nas --profile tools \
  #     run --rm tools-improvements npm run db:migrate
  #
  # ⚠️ tools-as 와 달리 drizzle/ 볼륨이 없다. 그 저장소의 Dockerfile 이 tools
  #    스테이지 안에 drizzle/ 를 함께 굽기 때문이다(tools-meters 와 같은 모양).
  #    대신 **마이그레이션이 늘면 도구 이미지를 다시 구워 옮겨야 한다.** A/S 는
  #    drizzle/ 만 28MB 라 볼륨으로 갈아 끼우는 편이 쌌지만, 여기는 마이그레이션이
  #    셋뿐이라 그 장치를 미리 만들 값이 없다. 필요해지면 그때 as 를 베낀다.
  #
  # 첨부 볼륨도 붙이지 않는다 — 이 저장소의 db 스크립트는 db:generate·db:migrate
  # 둘뿐이고 둘 다 파일을 보지 않는다. 파일을 보는 스크립트가 생기면 그때
  # app-improvements 와 **같은 자리**에 같은 볼륨을 붙인다.
  #
  # ── 🔴 개선요청 ③/셋 — 2026-09-18 주석 처리 ═════════════════════════
  #    개선요청 첫 설치를 **다른 날로 미뤘다**(2026-09-18 결정).
  #    🔴 이 서비스도 `./env/improvements.env` 를 요구하는데 **그 파일이 아직
  #       NAS 에 없다.** 켜 두면 `docker compose` 명령이 **통째로** 안 먹는다 —
  #       `profiles: [tools]` 라 평소에 뜨지 않는 서비스여도 마찬가지다.
  #       compose 는 파일을 읽을 때 모든 서비스의 env_file 을 확인한다.
  #
  #    🔴 벗기는 때: `runbook/06-개선요청-배포.md` 의 **첫 설치를 할 때**.
  #       그 문서 2-ㅅ 가 `env/improvements.env` 를 만들고, 4절 ① 이 이 서비스로
  #       `db:migrate` 를 돌린다. 세 자리(① db-app 의 IMPROVEMENTS_APP_PASSWORD ·
  #       ② app-improvements · ③ 여기)를 **함께** 벗긴다.
  #       벗기는 법: 아래 줄들의 맨 앞 두 칸 뒤에 붙은 `# ` 만 지운다.
  #
  tools-improvements:
    image: dss-improvements-tools:2
    profiles: [tools]
    networks: [dss-data, dss-edge]
    env_file:
      - ./env/improvements.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://dss_improvements_app:${IMPROVEMENTS_APP_PASSWORD}@dss-pg-app:5432/dss_improvements
    deploy:
      resources:
        limits:
          memory: 512M

  # ══ 도구 — 휴가. 평소에는 뜨지 않는다 (2026-09-29 더함) ═══════════════
  #
  # 운영 이미지에는 drizzle-kit 도 tsx 도 없다(둘 다 devDependency). 그 안에서는
  # db:migrate 도 seed:ranks 도 부를 수 없다 — tools-improvements 와 같은 자리다.
  #
  #   docker compose -f docker-compose.nas.yml --env-file .env.nas --profile tools \
  #     run --rm tools-leave npm run db:migrate
  #   docker compose -f docker-compose.nas.yml --env-file .env.nas --profile tools \
  #     run --rm tools-leave npm run seed:ranks
  #
  # 🔴 첫 설치에는 **둘 다** 부르고, **순서가 있다** — db:migrate 로 표를 만든
  #    뒤에야 seed:ranks 가 들어간다. 직급(web_ranks)이 비어 있으면 직원을 한
  #    명도 등록할 수 없다(직원 추가 화면의 직급 칸이 필수인데 고를 것이 없어
  #    거기서 막힌다). 그러니 마이그레이션만으로는 운영을 시작할 수 없다.
  #    seed:ranks 는 직급만 넣고 여러 번 돌려도 중복이 생기지 않는다.
  #    🔴 seed:dev 는 부르지 않는다 — 가짜 사람까지 넣는 개발 전용이다.
  #
  # 🔴 DATABASE_URL 을 반드시 준다. 없으면 그 저장소의 src/lib/env.ts 가
  #    「환경변수 DATABASE_URL 이(가) 설정되지 않았습니다. **.env.local 파일을
  #    확인하세요**」로 죽는다. 뒷문장이 개발 PC 용이라, NAS 에서 그 줄만 보면
  #    없는 파일을 찾아 헤매게 된다. 원인은 이 줄이 빠진 것이다.
  #
  # ⚠️ tools-as 와 달리 drizzle/ 볼륨이 없다. 그 저장소의 Dockerfile tools
  #    스테이지가 drizzle/ 를 함께 굽기 때문이다(tools-improvements 와 같은 모양).
  #    대신 **마이그레이션이 늘면 도구 이미지를 다시 구워 옮겨야 한다.**
  #
  # 파일 볼륨도 붙이지 않는다 — 이 앱에는 업로드 폴더 자체가 없다(app-leave 주석).
  tools-leave:
    image: dss-leave-tools:1
    profiles: [tools]
    networks: [dss-data, dss-edge]
    env_file:
      - ./env/leave.env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://dss_leave_app:${LEAVE_APP_PASSWORD}@dss-pg-app:5432/dss_leave
    deploy:
      resources:
        limits:
          # 다른 도구 셋과 같은 512M. profiles 가 붙어 `up -d` 로 뜨지 않으므로
          # 아래 상시 예산에 들어가지 않는다 — 불릴 때만 잠깐 떴다 사라진다.
          memory: 512M

# ══ 메모리 예산 ═════════════════════════════════════════════════════════
#
#   db-app            768M
#   db-auth           384M
#   app-as            640M
#   app-meters        512M
#   app-auth          384M
#   ─────────────────────
#   지금 합계        2.6GB   + DSM 자체 약 1.2GB = 3.8GB / 6GB
#
#   app-improvements  384M   ← 2026-09-18 더했다가 **지금은 주석 처리돼 꺼져 있다**
#                              (위 ②번 자리). 이 예산을 지우지 않는 이유는,
#                              개선요청을 켤 때 그만큼이 실제로 필요하기 때문이다.
#   ─────────────────────
#   개선요청을 켜면  3.0GB   + DSM 자체 약 1.2GB = 4.2GB / 6GB
#
# 여유가 개선요청을 켠 뒤에도 1.8GB 남는다. 파일 캐시로 쓰이므로 남는 것이 낭비가 아니다 —
# HDD 인 이 장비에서는 오히려 그쪽이 체감을 좌우한다.
# 2026-09-14 실측: 커널이 보는 전체 5,786MB · 컨테이너 없이 사용 중 648MB.
#
# ── 그 뒤에 늘어난 것 (위 표는 개선요청까지만 적혀 있다) ────────────────
#
#   app-po            640M   ← 2026-09-28 첫 설치. A/S 와 같은 엑셀 파싱을 한다.
#   app-leave         384M   ← 2026-09-29 첫 설치. 개선요청과 같은 값이다 —
#                              업로드도 엑셀 파싱도 없어 그보다 가볍다.
#   ─────────────────────
#   여섯 사이트를 다 켠 지금   4,096MB (= 4.0GB)
#     + DSM 자체 (2026-09-14 실측 648MB)     = 4.7GB / 5.8GB · 여유 약 1.0GB
#     + DSM 자체 (넉넉히 잡아 1.2GB)          = 5.3GB / 5.8GB · 여유 약 0.5GB
#
# 🔴 이것은 **상한이지 예약이 아니다.** 실제 사용은 훨씬 적다 — Next.js
#    standalone 한 채가 평시 100~150MB 다. 그래도 여유 칸이 처음으로 1GB 언저리로
#    내려왔다. 일곱째 사이트를 더할 때는 이 표를 믿지 말고 **그때 실측**해서
#    (`docker stats --no-stream`) 다시 적는다.
#
# ══ 아직 여기 없는 것 ═══════════════════════════════════════════════════
#
# 1. A/S 의 도구 컨테이너 `tools-as`. 계측기 쪽은 위 tools-meters 로 생겼다
#    (2026-09-16, 알림 메일이 먼저 급해서). 같은 틀을 복사하면 되지만 A/S 는
#    붙일 것이 더 있다 — drizzle/ 을 이미지에 굽지 말고 볼륨으로(runbook/05 6절 ①),
#    첨부·양식·백업 폴더. 그것이 생겨야 db:migrate·db:preflight 와 매일 밤
#    purge 셋이 NAS 에서 돈다. 지금은 개발 PC 와 Windows 예약 작업이 하고 있다.
#
#    계측기 쪽에도 아직 안 붙인 것이 있다 — 백업(BACKUP_ROOT)·성적서 가져오기
#    (CERT_SOURCE_ROOT). 그 폴더는 NAS 의 /volume1/2_AS센터/3. 계측기 관리/
#    아래 8번·4번이고, 알림 메일과 달리 급하지 않아 볼륨을 붙이지 않았다.
#
# 2. VPN — 6단계에서. (HTTPS 는 2026-09-15 에 붙었다 — 이 파일 밖, DSM 과 setup/04·05 에서.)
#    리버스 프록시 규칙(위 원칙 2의 그림 + 443 호스트 이름 셋)은 DSM
#    제어판 → 로그인 포털 → 고급 → 리버스 프록시에서 사람이 넣는다.
#
# ══ 여기 없는 것 ═══════════════════════════════════════════════════════
#
# 회사 홈페이지(dss-home)는 **앱도 DB도 NAS 에 두지 않는다**(2026-09-02 확정).
# 공개 사이트를 여기 올리면 외부 공개를 위해 방화벽에 구멍을 내야 하고, 그
# 구멍이 이 다섯 옆에 뚫린다. 그래서 NAS 는 사내 전용 셋만 담는다.
#
# 사내 A/S 가 바깥의 홈페이지를 불러 가는 길(DSS_HOME_URL → /api/nas-sync/*)은
# **안에서 밖으로** 나가는 요청이라 여기에 아무것도 열 필요가 없다.
# 홈페이지가 배포되면 as.env 에 DSS_HOME_URL 과 DSS_HOME_SYNC_SECRET 을 채운다.
# 그 전까지 A/S 의 고객 포털 기능은 꺼져 있다(버튼을 누르면 설정이 없다고 알린다).

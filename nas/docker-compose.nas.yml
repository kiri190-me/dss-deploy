# 2. VPN — 6단계에서. (HTTPS 는 2026-09-15 에 붙었다 — 이 파일 밖, DSM 과 setup/04·05 에서.)
#    리버스 프록시 규칙(위 원칙 2의 그림 + 443 호스트 이름 셋)은 DSM

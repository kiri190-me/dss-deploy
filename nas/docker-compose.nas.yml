# ══ 여기 없는 것 ═══════════════════════════════════════════════════════
#
# 회사 홈페이지(dss-home)는 **앱도 DB도 NAS 에 두지 않는다**(2026-09-02 확정).
# 공개 사이트를 여기 올리면 외부 공개를 위해 방화벽에 구멍을 내야 하고, 그
# 구멍이 이 다섯 옆에 뚫린다. 그래서 NAS 는 사내 전용 셋만 담는다.
#
# 사내 A/S 가 바깥의 홈페이지를 불러 가는 길(DSS_HOME_URL → /api/nas-sync/*)은
# **안에서 밖으로** 나가는 요청이라 여기에 아무것도 열 필요가 없다.
# 홈페이지가 배포되면 as.env 에 DSS_HOME_URL 과 DSS_HOME_SYNC_SECRET 을 채운다.
# 그 전까지 A/S 의 고객 포털 기능은 꺼져 있다(버튼을 누르면 설정이 없다고 알린다).
